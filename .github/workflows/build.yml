name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_VERSION: "9.3.1"
      EXPECTED_SHA1: "13:31:D8:2A:32:C3:73:3F:AE:98:4E:60:88:61:31:1B:1E:4A:6B:AB"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Pasang Gradle (dengan cek checksum)
        run: |
          curl -fsSL -o gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          curl -fsSL -o gradle.zip.sha256 "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip.sha256"
          echo "$(cat gradle.zip.sha256)  gradle.zip" | sha256sum -c -
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Siapkan keystore dari Secrets
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KS_B64" || { echo "::error::Secret KEYSTORE_BASE64 kosong"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Verifikasi SHA-1 keystore sama dengan Google Cloud
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          SHA=$(keytool -list -v -keystore "$DEBUG_KEYSTORE_PATH" -storepass:env KS_PASS | grep -m1 'SHA1:' | sed 's/.*SHA1: *//')
          echo "SHA-1 keystore: $SHA"
          test "$SHA" = "$EXPECTED_SHA1" || { echo "::error::SHA-1 tidak cocok dengan yang terdaftar di Google Cloud"; exit 1; }

      - name: Tulis .env (semua nilai publik)
        run: |
          {
            echo "SUPABASE_URL=https://bxjehrnneedmpvenzdzx.supabase.co"
            echo "SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4amVocm5uZWVkbXB2ZW56ZHp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NDk4MTQsImV4cCI6MjEwNjMyNTgxNH0.9K8eoKkajfAh5hLFEQvt_5ven8AF9Rh5L6thF0xH84g"
            echo "SUPABASE_PUBLISHABLE_KEY=sb_publishable_Szva0PFMm3tC207ZI7yDXA_hTep-Oy7"
            echo "GOOGLE_WEB_CLIENT_ID=479527077405-env78bgrmqtf1aoaob61i9osdlei64q6.apps.googleusercontent.com"
            echo "GOOGLE_ANDROID_CLIENT_ID=479527077405-3qsqu93pjtjs5hbqr87521tvn7jt25to.apps.googleusercontent.com"
            echo "APP_LINK_HOST=mykuniran.app"
          } > .env

      - name: Build debug APK
        env:
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Periksa BuildConfig dan tanda tangan APK
        run: |
          echo "--- SUPABASE_URL di BuildConfig:"
          grep -rh 'SUPABASE_URL' app/build/generated/source/buildConfig/debug | head -2
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --print-certs "$APK" | grep -i 'SHA-1'
          GOT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'SHA-1' | sed 's/.*: *//')
          WANT=$(echo "$EXPECTED_SHA1" | tr -d ':' | tr 'A-Z' 'a-z')
          test "$GOT" = "$WANT" || { echo "::error::APK tidak ditandatangani keystore yang benar"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: mykuniran-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
